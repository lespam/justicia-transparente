[project]
name = "justicia-pipeline"
version = "0.1.0"
description = "Cosecha, procesamiento e indexación de sentencias de los Poderes Judiciales estatales"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "asyncpg>=0.29",
    "structlog>=24.1",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Enmascaramiento de nombres. Necesario para el comando `procesar`.
nlp = [
    "spacy>=3.8,<3.9",
    "es_core_news_md @ https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl",
]

[project.scripts]
justicia = "justicia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/justicia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
